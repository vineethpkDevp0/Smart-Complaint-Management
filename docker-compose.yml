
services:
  backend:
    build: ./backend
    container_name: smart-complaint-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smart-complaint-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
